<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joel Tenenberg</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    color: #ccc;
    font-family: 'Inter', system-ui, sans-serif;
    user-select: none;
  }

  /*
    NO will-change, NO translateZ, NO GPU promotion on the canvas.
    This lets the browser re-rasterize text at native resolution
    on every zoom level instead of upscaling a cached bitmap.
  */
  #canvas-root {
    position: absolute;
    top: 0; left: 0;
    width: 4000px; height: 3000px;
    transform-origin: 0 0;
    cursor: grab;
  }
  #canvas-root.dragging { cursor: grabbing; }

  /* Cluster bezier curves — inside canvas so they scale with nodes */
  #cluster-svg {
    position: absolute;
    top: 0; left: 0;
    width: 4000px; height: 3000px;
    pointer-events: none;
    overflow: visible;
  }

  .node {
    position: absolute;
    border: 1px solid rgba(255,255,255,0.09);
    background: rgba(10,10,10,0.92);
  }

  .node-title {
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.02em;
    white-space: nowrap;
    cursor: default;
  }
  .node-title.is-about {
    font-size: 13px;
    color: rgba(255,255,255,0.9);
  }
  .node-title:active { cursor: grabbing; }

  .node-image {
    width: 190px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .node-image:hover { border-color: rgba(255,255,255,0.22); }
  .image-stack { position: relative; width: 100%; }
  .image-stack::before,
  .image-stack::after {
    content: '';
    position: absolute; inset: 0;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.01);
    pointer-events: none;
  }
  .image-stack::before { transform: translate(4px,4px);  z-index: 0;  }
  .image-stack::after  { transform: translate(8px,8px);  z-index: -1; }
  .image-stack img {
    position: relative; z-index: 1;
    display: block; width: 100%;
    aspect-ratio: 4/3; object-fit: cover; opacity: 0.82;
  }
  .image-count {
    position: absolute; bottom: 6px; right: 8px; z-index: 2;
    font-size: 9px; color: rgba(255,255,255,0.35); letter-spacing: 0.05em;
  }

  .node-text {
    width: 210px;
    padding: 13px 15px;
    font-size: 11px;
    line-height: 1.7;
    color: rgba(255,255,255,0.42);
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .node-text:hover { border-color: rgba(255,255,255,0.18); }
  .text-toggle {
    display: block; margin-top: 7px;
    font-size: 9.5px; color: rgba(255,255,255,0.22); letter-spacing: 0.06em;
  }

  .node-detail {
    width: 148px;
    padding: 11px 13px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .detail-row   { display: flex; flex-direction: column; gap: 2px; }
  .detail-label { font-size: 8.5px; color: rgba(255,255,255,0.2); letter-spacing: 0.09em; text-transform: uppercase; }
  .detail-value { font-size: 10px; color: rgba(255,255,255,0.42); line-height: 1.45; }
  .detail-link  { font-size: 10px; color: rgba(255,255,255,0.32); text-decoration: none; display: block; margin-bottom: 2px; }
  .detail-link:hover { color: rgba(255,255,255,0.72); }

  /* Search line overlay — fixed viewport, above canvas */
  #line-overlay {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none; z-index: 10;
  }

  /* Image lightbox */
  #lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.93); z-index: 100;
    align-items: center; justify-content: center;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 88vw; max-height: 88vh; object-fit: contain; display: block; }
  #lb-prev, #lb-next {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: rgba(255,255,255,0.4);
    font-size: 26px; cursor: pointer; padding: 20px; transition: color 0.15s;
  }
  #lb-prev:hover, #lb-next:hover { color: rgba(255,255,255,0.9); }
  #lb-prev { left: 10px; } #lb-next { right: 10px; }
  #lb-close {
    position: fixed; top: 16px; right: 20px;
    background: none; border: none; color: rgba(255,255,255,0.4);
    font-size: 20px; cursor: pointer; transition: color 0.15s;
  }
  #lb-close:hover { color: rgba(255,255,255,0.9); }
  #lb-counter {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: rgba(255,255,255,0.25); letter-spacing: 0.1em;
  }

  /* Text lightbox */
  #text-lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.93); z-index: 100;
    align-items: center; justify-content: center;
  }
  #text-lightbox.open { display: flex; }
  #tlb-inner {
    max-width: 600px; width: 90vw; max-height: 80vh; overflow-y: auto;
    padding: 36px 40px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(12,12,12,0.99);
    font-size: 13px; line-height: 1.85;
    color: rgba(255,255,255,0.5);
    white-space: pre-wrap;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  #tlb-title {
    font-size: 10px; font-weight: 500;
    color: rgba(255,255,255,0.3); letter-spacing: 0.09em;
    text-transform: uppercase; margin-bottom: 18px;
  }
  #tlb-close {
    position: fixed; top: 16px; right: 20px;
    background: none; border: none; color: rgba(255,255,255,0.4);
    font-size: 20px; cursor: pointer; transition: color 0.15s; z-index: 101;
  }
  #tlb-close:hover { color: rgba(255,255,255,0.9); }

  /* Search input — tracks canvas centre point in screen space */
  #input-wrap {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex; align-items: center;
  }
  #query-input {
    width: 230px;
    background: rgba(10,10,10,0.92);
    border: 1px solid rgba(255,255,255,0.13); border-right: none;
    color: #ddd; font-size: 12px; padding: 8px 12px;
    outline: none; font-family: inherit; transition: border-color 0.2s;
  }
  #query-input::placeholder { color: rgba(255,255,255,0.2); }
  #query-input:focus { border-color: rgba(255,255,255,0.28); }
  #query-input:disabled { opacity: 0.35; cursor: not-allowed; }
  #send-btn {
    background: rgba(10,10,10,0.92);
    border: 1px solid rgba(255,255,255,0.13);
    color: rgba(255,255,255,0.38); padding: 8px 12px;
    cursor: pointer; font-size: 12px; font-family: inherit; transition: color 0.15s;
  }
  #send-btn:hover:not(:disabled) { color: #ddd; }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  #loading-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(255,255,255,0.35);
    animation: pulse 1.1s ease-in-out infinite;
    margin-left: 10px; display: none;
  }
  @keyframes pulse { 0%,100%{opacity:.2} 50%{opacity:.9} }

  /* ─────────────────────────────────────────────
     Mobile accordion view (≤ 600 px)
     ───────────────────────────────────────────── */
  #mobile-view { display: none; }

  @media (max-width: 600px) {
    html, body { overflow: auto; }
    #canvas-root, #line-overlay, #lightbox, #text-lightbox { display: none !important; }

    #mobile-view {
      display: block;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      background: #0a0a0a;
      -webkit-overflow-scrolling: touch;
    }

    .m-item { border-bottom: 1px solid rgba(255,255,255,0.09); }

    .m-header {
      padding: 18px 20px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      /* reset <button> defaults */
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }
    .m-header::after {
      content: '+';
      font-size: 20px;
      color: rgba(255,255,255,0.25);
      line-height: 1;
      margin-left: 12px;
      flex-shrink: 0;
    }
    .m-header.open { color: rgba(255,255,255,0.9); }
    .m-header.open::after { content: '−'; }

    .m-content {
      display: none;
      padding: 0 20px 24px;
    }
    .m-content.open { display: block; }

    .m-text {
      font-size: 12px;
      line-height: 1.75;
      color: rgba(255,255,255,0.42);
      margin-bottom: 18px;
      white-space: pre-wrap;
    }

    .m-img {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      object-fit: cover;
    }
    .m-img:last-child { margin-bottom: 0; }
  }
</style>
</head>
<body>

<div id="canvas-root">
  <svg id="dot-grid" style="position:absolute;top:0;left:0;width:4000px;height:3000px;pointer-events:none;">
    <defs>
      <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.1)"/>
      </pattern>
    </defs>
    <rect width="4000" height="3000" fill="url(#dots)"/>
  </svg>
  <svg id="cluster-svg"></svg>
  <div id="input-wrap">
    <input id="query-input" type="text" placeholder="" autocomplete="off" disabled>
    <button id="send-btn" disabled>→</button>
    <div id="loading-dot"></div>
  </div>
</div>

<svg id="line-overlay"></svg>

<div id="lightbox">
  <button id="lb-close">✕</button>
  <button id="lb-prev">‹</button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next">›</button>
  <div id="lb-counter"></div>
</div>

<div id="text-lightbox">
  <button id="tlb-close">✕</button>
  <div id="tlb-inner">
    <div id="tlb-title"></div>
    <div id="tlb-body"></div>
  </div>
</div>


<div id="mobile-view"></div>

<script type="module">
import PROJECTS from './projects.js';

// ─────────────────────────────────────────────
// Seeded PRNG (mulberry32)
// ─────────────────────────────────────────────
function seededRand(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function strSeed(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
  return h >>> 0;
}

// ─────────────────────────────────────────────
// Markdown fetch + strip
// ─────────────────────────────────────────────
function stripMd(txt) {
  return txt
    .replace(/^---[\s\S]*?---\s*/m, '')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/\*(.*?)\*/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/^[-*]\s+/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

async function fetchMdBody(id) {
  try {
    const txt = await fetch(`media/projects/${id}/description.md`).then(r => r.ok ? r.text() : null);
    return txt ? stripMd(txt) : null;
  } catch { return null; }
}

// Parse YAML-ish frontmatter from detail.md into a plain object.
// Supports string scalars, indented list items, and nested list-of-objects.
function parseFrontmatter(txt) {
  const m = txt.match(/^---\n([\s\S]*?)\n---/);
  if (!m) return {};
  const out = {};
  const lines = m[1].split('\n');
  let key = null, listKey = null, listObj = null;
  for (const raw of lines) {
    const line = raw.trimEnd();
    // nested object item inside a list:  "  - label: ..."
    const objItem = line.match(/^  - (\w+):\s*"?([^"]*)"?$/);
    if (objItem && listKey) {
      listObj = { [objItem[1]]: objItem[2].trim() };
      if (!Array.isArray(out[listKey])) out[listKey] = [];
      out[listKey].push(listObj);
      continue;
    }
    // continuation key on a list object:  "    url: ..."
    const objCont = line.match(/^    (\w+):\s*"?([^"]*)"?$/);
    if (objCont && listObj) {
      listObj[objCont[1]] = objCont[2].trim();
      continue;
    }
    // plain list item:  "  - value"
    const listItem = line.match(/^  - (.+)$/);
    if (listItem && listKey) {
      if (!Array.isArray(out[listKey])) out[listKey] = [];
      out[listKey].push(listItem[1].replace(/^"|"$/g, '').trim());
      listObj = null;
      continue;
    }
    // top-level list key with no inline value
    const listStart = line.match(/^(\w+):\s*\[\s*\]\s*$|^(\w+):\s*$/);
    if (listStart) {
      listKey = listStart[1] || listStart[2];
      out[listKey] = [];
      key = null; listObj = null;
      continue;
    }
    // top-level key
    const kv = line.match(/^(\w+):\s*"?([^"]*)"?$/);
    if (kv) {
      key = kv[1]; listKey = null; listObj = null;
      const val = kv[2].trim();
      out[key] = val === '' ? null : val;
      continue;
    }
  }
  return out;
}

async function fetchDetail(id) {
  try {
    const txt = await fetch(`media/projects/${id}/detail.md`).then(r => r.ok ? r.text() : null);
    return txt ? parseFrontmatter(txt) : {};
  } catch { return {}; }
}
const TRUNC = 240;
function trunc(full) {
  if (full.length <= TRUNC) return { short: full, more: false };
  const c = full.lastIndexOf(' ', TRUNC);
  return { short: full.slice(0, c > 0 ? c : TRUNC), more: true };
}

// ─────────────────────────────────────────────
// Layout constants — all in canvas px
// ─────────────────────────────────────────────
const CANVAS_CX = 2000, CANVAS_CY = 1500;

// Node sizes in canvas px (must match CSS widths + estimated heights)
const SZ = {
  title:  { w: 220, h: 38  },
  image:  { w: 190, h: 154 }, // 190 × (190 * 3/4) + border
  text:   { w: 210, h: 108 },
  detail: { w: 148, h: 100 },
};

// Spiral placement for non-about projects
function spiralPos(i) {
  const a = i * 2.399963, r = 420 * Math.sqrt(i + 1);
  return { x: CANVAS_CX + r * Math.cos(a), y: CANVAS_CY + r * Math.sin(a) };
}
let si = 0;
PROJECTS.forEach(p => { if (p.id !== 'about') Object.assign(p, spiralPos(si++)); });

// ─────────────────────────────────────────────
// Satellite positions — tight, non-overlapping
// Three satellites at 120° sectors around title centre.
// Distance from title centre: half-diagonal of the satellite node
// + half-diagonal of the title node + gap.
// ─────────────────────────────────────────────
const GAP = 22; // canvas px between node edges
const SECTOR = (2 * Math.PI) / 3;

function halfDiag(type) {
  return Math.sqrt(SZ[type].w ** 2 + SZ[type].h ** 2) / 2;
}

function satPos(p, typeIndex) {
  const types  = ['image', 'text', 'detail'];
  const type   = types[typeIndex];
  const rand   = seededRand(strSeed(p.id + 'base'));
  const base   = rand() * 2 * Math.PI;
  const jitter = seededRand(strSeed(p.id + type));
  const angle  = base + typeIndex * SECTOR + (jitter() - 0.5) * 0.35;
  // edge-to-edge gap: distance between centres = diag/2 of each + gap
  const dist   = halfDiag('title') + halfDiag(type) + GAP;
  return {
    x: p.x + dist * Math.cos(angle),
    y: p.y + dist * Math.sin(angle),
  };
}

// ─────────────────────────────────────────────
// Pan / zoom
// ─────────────────────────────────────────────
const MIN_ZOOM = 0.2, MAX_ZOOM = 3.0, INITIAL_ZOOM = 0.6;
let zoom = INITIAL_ZOOM;
let pan  = {
  x: window.innerWidth  / 2 - CANVAS_CX * zoom,
  y: window.innerHeight / 2 - CANVAS_CY * zoom,
};

const canvasRoot = document.getElementById('canvas-root');
const clusterSvg = document.getElementById('cluster-svg');
const lineSvg         = document.getElementById('line-overlay');
const clusterRects    = {};
const clusterTitlePos = {};
const clusterNodes    = {}; // id → { titleEl, cx, cy, satellites:[{el,ox,oy,w,h}] }
let   lineScores      = {};
const inputWrap  = document.getElementById('input-wrap');
// Place input at canvas centre — it now lives inside #canvas-root and scales with zoom
inputWrap.style.left = CANVAS_CX + 'px';
inputWrap.style.top  = CANVAS_CY + 'px';
const inputEl    = document.getElementById('query-input');
const sendBtn    = document.getElementById('send-btn');
const loadDot    = document.getElementById('loading-dot');

function applyTransform() {
  canvasRoot.style.transform = `translate(${pan.x}px,${pan.y}px) scale(${zoom})`;
  redrawClusterCurves();
  redrawLines();
}
applyTransform();

// ─────────────────────────────────────────────
// Cluster drag
// ─────────────────────────────────────────────
function moveCluster(id, newCx, newCy) {
  const c = clusterNodes[id];
  if (!c) return;
  c.cx = newCx; c.cy = newCy;
  // move title
  c.titleEl.style.left = Math.round(newCx - SZ.title.w / 2) + 'px';
  c.titleEl.style.top  = Math.round(newCy - SZ.title.h / 2) + 'px';
  // move satellites and rebuild rects
  const rects = [{ x: newCx - SZ.title.w/2, y: newCy - SZ.title.h/2, w: SZ.title.w, h: SZ.title.h }];
  for (const s of c.satellites) {
    const sx = newCx + s.ox, sy = newCy + s.oy;
    s.el.style.left = Math.round(sx - s.w / 2) + 'px';
    s.el.style.top  = Math.round(sy - s.h / 2) + 'px';
    rects.push({ x: sx - s.w/2, y: sy - s.h/2, w: s.w, h: s.h });
  }
  clusterRects[id]    = rects;
  clusterTitlePos[id] = { x: newCx, y: newCy };
  redrawClusterCurves();
  redrawLines();
}

let clusterDragging = null; // { id, startCx, startCy, mouseStartX, mouseStartY }

// Pan
let dragging = false, dragStart = { x: 0, y: 0 }, panStart = { x: 0, y: 0 };
document.addEventListener('mousedown', e => {
  if (e.target.closest('#input-wrap,#lightbox,#text-lightbox,.node-image,.detail-link,.node-text')) return;
  // Check if clicking a title node
  const titleEl = e.target.closest('.node-title');
  if (titleEl && titleEl._clusterId) {
    e.stopPropagation();
    const c = clusterNodes[titleEl._clusterId];
    clusterDragging = { id: titleEl._clusterId, startCx: c.cx, startCy: c.cy, mouseStartX: e.clientX, mouseStartY: e.clientY };
    canvasRoot.classList.add('dragging');
    return;
  }
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  panStart  = { ...pan };
  canvasRoot.classList.add('dragging');
});
document.addEventListener('mousemove', e => {
  if (clusterDragging) {
    const dx = (e.clientX - clusterDragging.mouseStartX) / zoom;
    const dy = (e.clientY - clusterDragging.mouseStartY) / zoom;
    moveCluster(clusterDragging.id, clusterDragging.startCx + dx, clusterDragging.startCy + dy);
    return;
  }
  if (!dragging) return;
  pan.x = panStart.x + (e.clientX - dragStart.x);
  pan.y = panStart.y + (e.clientY - dragStart.y);
  applyTransform();
});
document.addEventListener('mouseup', () => {
  dragging = false;
  clusterDragging = null;
  canvasRoot.classList.remove('dragging');
});

// Zoom
function doZoom(delta, cx, cy) {
  const nz = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.exp(-delta * 0.001)));
  const r  = nz / zoom;
  pan.x = cx + (pan.x - cx) * r;
  pan.y = cy + (pan.y - cy) * r;
  zoom  = nz;
  applyTransform();
}
document.addEventListener('wheel', e => {
  if (e.target.closest('#tlb-inner')) return;
  e.preventDefault(); doZoom(e.deltaY, e.clientX, e.clientY);
}, { passive: false });
let lp = null;
document.addEventListener('touchstart', e => { if (e.touches.length === 2) lp = pd(e); }, { passive: true });
document.addEventListener('touchmove',  e => {
  if (e.touches.length !== 2) return;
  const d = pd(e);
  const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
  const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
  if (lp) doZoom((lp - d) * 5, cx, cy);
  lp = d;
}, { passive: true });
document.addEventListener('touchend', () => { lp = null; });
function pd(e) {
  return Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY);
}

// ─────────────────────────────────────────────
// Lightboxes
// ─────────────────────────────────────────────
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lb-img');
const lbCtr    = document.getElementById('lb-counter');
let lbImgs = [], lbI = 0;
function openImgLb(imgs, i) {
  lbImgs = imgs; lbI = i;
  lbImg.src = lbImgs[lbI];
  lbCtr.textContent = `${lbI + 1} / ${lbImgs.length}`;
  lightbox.classList.add('open');
}
function lbStep(d) {
  lbI = (lbI + d + lbImgs.length) % lbImgs.length;
  lbImg.src = lbImgs[lbI];
  lbCtr.textContent = `${lbI + 1} / ${lbImgs.length}`;
}
document.getElementById('lb-close').onclick = () => lightbox.classList.remove('open');
document.getElementById('lb-prev').onclick  = () => lbStep(-1);
document.getElementById('lb-next').onclick  = () => lbStep(1);
lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('open'); });

const textLb   = document.getElementById('text-lightbox');
const tlbTitle = document.getElementById('tlb-title');
const tlbBody  = document.getElementById('tlb-body');
function openTxtLb(title, body) { tlbTitle.textContent = title; tlbBody.textContent = body; textLb.classList.add('open'); }
document.getElementById('tlb-close').onclick = () => textLb.classList.remove('open');
textLb.addEventListener('click', e => { if (e.target === textLb) textLb.classList.remove('open'); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { lightbox.classList.remove('open'); textLb.classList.remove('open'); }
  if (lightbox.classList.contains('open')) {
    if (e.key === 'ArrowLeft')  lbStep(-1);
    if (e.key === 'ArrowRight') lbStep(1);
  }
});

// ─────────────────────────────────────────────
// DOM helpers
// ─────────────────────────────────────────────
function el(tag, cls = '', txt = '') {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt) e.textContent = txt;
  return e;
}
// Place node top-left corner at canvas (x, y)
function place(node, x, y) {
  node.style.left = Math.round(x) + 'px';
  node.style.top  = Math.round(y) + 'px';
  canvasRoot.appendChild(node);
}
// Place node so its centre is at canvas (cx, cy)
function placeCentered(node, cx, cy, w, h) {
  place(node, cx - w / 2, cy - h / 2);
}

// ─────────────────────────────────────────────
// Cluster bezier curves (inside canvas, scale with nodes)
// ─────────────────────────────────────────────
// Stores canvas-px rects for each cluster

function convexHull(pts) {
  pts = pts.slice().sort((a, b) => a.x !== b.x ? a.x - b.x : a.y - b.y);
  const cross = (O, A, B) => (A.x - O.x) * (B.y - O.y) - (A.y - O.y) * (B.x - O.x);
  const lo = [], hi = [];
  for (const p of pts) {
    while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop();
    lo.push(p);
  }
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop();
    hi.push(p);
  }
  hi.pop(); lo.pop();
  return lo.concat(hi);
}

function catmullPath(hull) {
  const n = hull.length;
  if (n < 3) return '';
  const T = 0.4;
  let d = `M ${hull[0].x},${hull[0].y}`;
  for (let i = 0; i < n; i++) {
    const p0 = hull[(i - 1 + n) % n], p1 = hull[i],
          p2 = hull[(i + 1) % n],     p3 = hull[(i + 2) % n];
    const cp1x = p1.x + (p2.x - p0.x) * T, cp1y = p1.y + (p2.y - p0.y) * T;
    const cp2x = p2.x - (p3.x - p1.x) * T, cp2y = p2.y - (p3.y - p1.y) * T;
    d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2.x},${p2.y}`;
  }
  return d + ' Z';
}

function redrawClusterCurves() {
  if (!Object.keys(clusterRects).length) return;
  clusterSvg.innerHTML = '';
  const PAD = 18;
  for (const [, rects] of Object.entries(clusterRects)) {
    const pts = [];
    for (const r of rects) {
      pts.push({ x: r.x - PAD,       y: r.y - PAD       });
      pts.push({ x: r.x + r.w + PAD, y: r.y - PAD       });
      pts.push({ x: r.x + r.w + PAD, y: r.y + r.h + PAD });
      pts.push({ x: r.x - PAD,       y: r.y + r.h + PAD });
    }
    const hull = convexHull(pts);
    if (hull.length < 3) continue;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', catmullPath(hull));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'rgba(255,255,255,0.06)');
    path.setAttribute('stroke-width', '1');
    clusterSvg.appendChild(path);
  }
}

// ─────────────────────────────────────────────
// Build clusters
// ─────────────────────────────────────────────

function buildImageNode(p, images, rects) {
  if (!images?.length) return;
  const sat     = satPos(p, 0);
  const imgNode = el('div', 'node node-image');
  const stack   = el('div', 'image-stack');
  const img     = document.createElement('img');
  // images in detail.md are relative to the project folder
  const base    = `media/projects/${p.id}/`;
  const srcs    = images.map(i => i.startsWith('media/') ? i : base + i);
  img.src = srcs[0]; img.alt = ''; img.loading = 'lazy';
  stack.appendChild(img);
  if (srcs.length > 1) stack.appendChild(el('div', 'image-count', String(srcs.length)));
  imgNode.appendChild(stack);
  imgNode.addEventListener('click', e => { e.stopPropagation(); openImgLb(srcs, 0); });
  placeCentered(imgNode, sat.x, sat.y, SZ.image.w, SZ.image.h);
  rects.push({ x: sat.x - SZ.image.w / 2, y: sat.y - SZ.image.h / 2, w: SZ.image.w, h: SZ.image.h });
  clusterNodes[p.id].satellites.push({ el: imgNode, ox: sat.x - p.x, oy: sat.y - p.y, w: SZ.image.w, h: SZ.image.h });
}

function buildDetailNode(p, detail, rects) {
  const sat      = satPos(p, 2);
  const detailEl = el('div', 'node node-detail');
  const tools    = Array.isArray(detail.tools) ? detail.tools : [];
  const links    = Array.isArray(detail.links) ? detail.links : [];
  [
    detail.year     && ['Year',     detail.year],
    detail.role     && ['Role',     detail.role],
    detail.timeline && ['Timeline', detail.timeline],
    tools.length    && ['Tools',    tools.join(', ')],
  ].filter(Boolean).forEach(([lbl, val]) => {
    const row = el('div', 'detail-row');
    row.appendChild(el('div', 'detail-label', lbl));
    row.appendChild(el('div', 'detail-value', val));
    detailEl.appendChild(row);
  });
  if (links.length) {
    const row = el('div', 'detail-row');
    row.appendChild(el('div', 'detail-label', 'Links'));
    links.forEach(lnk => {
      const a = document.createElement('a');
      a.href = lnk.url; a.target = '_blank'; a.rel = 'noopener';
      a.className = 'detail-link'; a.textContent = lnk.label;
      a.addEventListener('click', e => e.stopPropagation());
      row.appendChild(a);
    });
    detailEl.appendChild(row);
  }
  if (detailEl.children.length) {
    placeCentered(detailEl, sat.x, sat.y, SZ.detail.w, SZ.detail.h);
    rects.push({ x: sat.x - SZ.detail.w / 2, y: sat.y - SZ.detail.h / 2, w: SZ.detail.w, h: SZ.detail.h });
    clusterNodes[p.id].satellites.push({ el: detailEl, ox: sat.x - p.x, oy: sat.y - p.y, w: SZ.detail.w, h: SZ.detail.h });
  }
}

PROJECTS.forEach(p => {
  const rects = [];

  // Title
  const titleEl = el('div', 'node node-title', p.title);
  if (p.id === 'about') titleEl.classList.add('is-about');
  titleEl._clusterId = p.id;
  titleEl.style.cursor = 'grab';
  placeCentered(titleEl, p.x, p.y, SZ.title.w, SZ.title.h);
  rects.push({ x: p.x - SZ.title.w / 2, y: p.y - SZ.title.h / 2, w: SZ.title.w, h: SZ.title.h });
  clusterTitlePos[p.id] = { x: p.x, y: p.y };
  clusterNodes[p.id] = { titleEl, cx: p.x, cy: p.y, satellites: [] };

  // Text node — from description.md
  {
    const sat    = satPos(p, 1);
    const textEl = el('div', 'node node-text');
    const body   = el('div', '');
    const toggle = el('span', 'text-toggle');
    textEl.appendChild(body);
    textEl.appendChild(toggle);
    fetchMdBody(p.id).then(md => {
      const fullText = md || p.title;
      const { short, more } = trunc(fullText);
      body.textContent = short + (more ? '…' : '');
      if (more) {
        toggle.textContent = 'read more';
        textEl.addEventListener('click', e => { e.stopPropagation(); openTxtLb(p.title, fullText); });
      } else {
        toggle.remove();
        textEl.style.cursor = 'default';
      }
    });
    placeCentered(textEl, sat.x, sat.y, SZ.text.w, SZ.text.h);
    rects.push({ x: sat.x - SZ.text.w / 2, y: sat.y - SZ.text.h / 2, w: SZ.text.w, h: SZ.text.h });
    clusterNodes[p.id].satellites.push({ el: textEl, ox: sat.x - p.x, oy: sat.y - p.y, w: SZ.text.w, h: SZ.text.h });
  }

  // Image + detail nodes — from detail.md (async, fills in after load)
  fetchDetail(p.id).then(detail => {
    buildImageNode(p, detail.images, rects);
    buildDetailNode(p, detail, rects);
    clusterRects[p.id] = rects;
    redrawClusterCurves();
  });

  clusterRects[p.id] = rects;
});

// Draw curves once after initial layout
redrawClusterCurves();

// ─────────────────────────────────────────────
// Search lines — viewport-space, from canvas-centre screen pos
// to title node screen pos
// ─────────────────────────────────────────────

// Canvas px → screen px
function c2s(cx, cy) {
  return { x: pan.x + cx * zoom, y: pan.y + cy * zoom };
}

// Returns the point on the edge of an axis-aligned rect closest to target
function rectEdgePoint(rx, ry, rw, rh, tx, ty) {
  const cx = rx + rw / 2, cy = ry + rh / 2;
  const dx = tx - cx, dy = ty - cy;
  if (dx === 0 && dy === 0) return { x: cx, y: cy };
  const scaleX = Math.abs(dx) > 0 ? (rw / 2) / Math.abs(dx) : Infinity;
  const scaleY = Math.abs(dy) > 0 ? (rh / 2) / Math.abs(dy) : Infinity;
  const s = Math.min(scaleX, scaleY);
  return { x: cx + dx * s, y: cy + dy * s };
}

function redrawLines() {
  lineSvg.innerHTML = '';
  const ids = Object.keys(lineScores);
  if (!ids.length) return;

  // Source: right edge of input wrap, converted from canvas to screen coords
  // Input is centred at (CANVAS_CX, CANVAS_CY); approximate half-width in canvas px
  const inputHalfW = (inputWrap.offsetWidth  || 260) / 2;
  const inputHalfH = (inputWrap.offsetHeight || 34)  / 2;
  const srcPt = c2s(CANVAS_CX + inputHalfW, CANVAS_CY);
  const srcX  = srcPt.x;
  const srcY  = srcPt.y;

  ids.forEach(id => {
    const score = lineScores[id];
    if (score < 0.3) return;
    const tp = clusterTitlePos[id]; if (!tp) return;

    // Title node screen rect
    const tScreen = c2s(tp.x, tp.y);
    const tw = SZ.title.w * zoom, th = SZ.title.h * zoom;
    const trx = tScreen.x - tw / 2, try_ = tScreen.y - th / 2;

    // Destination: edge of title node closest to source
    const dst = rectEdgePoint(trx, try_, tw, th, srcX, srcY);

    // Bezier: horizontal tangent out of input, tangent into node from src direction
    const dx   = dst.x - srcX;
    const bend = Math.max(Math.abs(dx) * 0.5, 80);
    const cp1x = srcX + bend, cp1y = srcY;
    const cp2x = dst.x - (dst.x - srcX) * 0.25, cp2y = dst.y - (dst.y - srcY) * 0.25;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${srcX},${srcY} C ${cp1x},${cp1y} ${cp2x},${cp2y} ${dst.x},${dst.y}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'white');
    path.setAttribute('stroke-width',   (score * 2.5).toFixed(2));
    path.setAttribute('stroke-opacity', (score * 0.75).toFixed(2));
    lineSvg.appendChild(path);
  });
}
function clearLines() { lineScores = {}; lineSvg.innerHTML = ''; }
function animateLines() {
  [...lineSvg.querySelectorAll('path')].forEach(p => {
    const t = parseFloat(p.getAttribute('stroke-opacity'));
    p.setAttribute('stroke-opacity', '0');
    let k = 0;
    const tick = () => {
      k += 0.07;
      if (k >= 1) { p.setAttribute('stroke-opacity', t); return; }
      p.setAttribute('stroke-opacity', (t * k).toFixed(3));
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

// ─────────────────────────────────────────────
// Embeddings
// ─────────────────────────────────────────────
let pipelineFn = null;
let embedder = null, nodeEmbeddings = {};

async function ensureTransformers() {
  if (pipelineFn) return true;
  try {
    const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.2/dist/transformers.min.js');
    env.allowLocalModels = false;
    env.useBrowserCache = true;
    pipelineFn = pipeline;
    return true;
  } catch (err) {
    console.error('Failed to load transformers runtime', err);
    return false;
  }
}

// Extract flat Float32Array from whatever the pipeline returns
function extractVec(out) {
  // v3 Tensor: out is Tensor with .data (Float32Array) and .dims
  // v2: out.data is Float32Array directly
  // Both cases: grab .data if it exists, else assume out itself is array-like
  const raw = out?.data ?? out;
  return raw instanceof Float32Array ? raw : new Float32Array(raw);
}

async function init() {
  const runtimeReady = await ensureTransformers();
  if (!runtimeReady) {
    loadDot.style.display = 'none';
    inputEl.placeholder = 'search unavailable';
    return;
  }
  loadDot.style.display = 'block';
  inputEl.placeholder = 'archive agent loading…';
  const stored = await fetch('embeddings.json').then(r => r.json()).catch(() => null);
  if (stored) {
    for (const id of Object.keys(stored))
      nodeEmbeddings[id] = new Float32Array(stored[id]);
  }
  embedder = await pipelineFn('feature-extraction', 'Xenova/all-mpnet-base-v2', { dtype: 'q8' });
  if (!stored) {
    for (const p of PROJECTS) {
      const out = await embedder(p.description, { pooling: 'mean', normalize: true });
      nodeEmbeddings[p.id] = extractVec(out);
    }
  }
  // Verify embeddings loaded correctly
  const ids = Object.keys(nodeEmbeddings);
  console.log(`Embeddings ready: ${ids.length} projects`, ids);
  loadDot.style.display = 'none';
  const hints = ['search', 'search', 'search', "you may ask what i'm proud of"];
  inputEl.placeholder = hints[Math.floor(Math.random() * hints.length)];
  inputEl.disabled = false; sendBtn.disabled = false; inputEl.focus();
}

function cosSim(a, b) {
  let d = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { d += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
  return d / (Math.sqrt(na) * Math.sqrt(nb));
}

async function runQuery(t) {
  if (!t.trim()) { clearLines(); return; }
  const out = await embedder(t, { pooling: 'mean', normalize: true });
  const q   = extractVec(out);
  const raw = {};
  for (const p of PROJECTS) {
    const vec = nodeEmbeddings[p.id];
    raw[p.id] = vec ? Math.max(0, cosSim(q, vec)) : 0;
  }
  // Normalise relative to best match so the strongest result always draws a line.
  // Absolute threshold of 0.4× max prevents near-zero scores from showing.
  const max = Math.max(...Object.values(raw));
  lineScores = {};
  if (max > 0) {
    for (const id of Object.keys(raw)) {
      const norm = raw[id] / max;
      if (norm >= 0.4) lineScores[id] = norm;
    }
  }
  redrawLines(); animateLines();
}

sendBtn.addEventListener('click', () => runQuery(inputEl.value));
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') runQuery(inputEl.value); });
inputEl.addEventListener('input',   () => { if (!inputEl.value) clearLines(); });

// ─────────────────────────────────────────────
// Mobile accordion view
// ─────────────────────────────────────────────
async function loadMobileItem(p, content) {
  // Fetch text and image list in parallel
  const [mdText, imgSrcs] = await Promise.all([
    (async () => {
      if (p.id === 'about') {
        const raw = await fetch('media/about/bio.md').then(r => r.ok ? r.text() : null).catch(() => null);
        return raw ? stripMd(raw) : null;
      }
      return fetchMdBody(p.id);
    })(),
    (async () => {
      if (p.id === 'about') {
        return ['media/about/profile-small.webp', 'media/about/profile2-small.webp'];
      }
      const detail = await fetchDetail(p.id);
      const base   = `media/projects/${p.id}/`;
      return (detail.images || []).map(i => i.startsWith('media/') ? i : base + i);
    })(),
  ]);

  if (mdText) {
    const textEl = document.createElement('div');
    textEl.className = 'm-text';
    textEl.textContent = mdText;
    content.appendChild(textEl);
  }

  const altBase = p.id === 'about' ? 'Profile photo of Joel Tenenberg' : `${p.title} — project image`;
  imgSrcs.forEach((src, idx) => {
    const img     = document.createElement('img');
    img.src       = src;
    img.alt       = p.id === 'about' ? `${altBase} ${idx + 1}` : altBase;
    img.className = 'm-img';
    img.loading   = 'lazy';
    content.appendChild(img);
  });
}

function buildMobileView() {
  const container = document.getElementById('mobile-view');
  if (!container) return;

  // Non-about projects first, about last
  const mobileProjects = [
    ...PROJECTS.filter(p => p.id !== 'about'),
    PROJECTS.find(p => p.id === 'about'),
  ].filter(Boolean);

  for (const p of mobileProjects) {
    const item    = document.createElement('div');
    item.className = 'm-item';

    const content = document.createElement('div');
    content.className = 'm-content';
    content.id = `m-content-${p.id}`;

    const header  = document.createElement('button');
    header.type = 'button';
    header.className = 'm-header';
    header.textContent = p.title;
    header.setAttribute('aria-controls', content.id);
    header.setAttribute('aria-expanded', 'false');

    header.addEventListener('click', () => {
      const isOpen = header.classList.contains('open');
      // Close all open items
      container.querySelectorAll('.m-header.open').forEach(h => {
        h.classList.remove('open');
        h.setAttribute('aria-expanded', 'false');
      });
      container.querySelectorAll('.m-content.open').forEach(c => c.classList.remove('open'));
      // Open this one only if it was previously closed
      if (!isOpen) {
        header.classList.add('open');
        header.setAttribute('aria-expanded', 'true');
        content.classList.add('open');
        // Lazy-load content on first open
        if (!content.dataset.loaded) {
          content.dataset.loaded = 'true';
          loadMobileItem(p, content).catch(console.error);
        }
      }
    });

    item.appendChild(header);
    item.appendChild(content);
    container.appendChild(item);
  }
}

if (window.matchMedia('(max-width: 600px)').matches) {
  buildMobileView();
} else {
  init().catch(console.error);
}
</script>
