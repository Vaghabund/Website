<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joel Tenenberg</title>
<link rel="icon" type="image/svg+xml" href="media/icons/LOGO.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<header id="site-header" aria-label="Site introduction">
  <img id="site-header-logo" src="media/icons/Name_bold.svg" alt="Joel Tenenberg">
  <p id="site-header-intro">between creative technology and spatial design</p>
</header>
<div id="mobile-sticky-header"></div>

<div id="canvas-root">
  <svg id="dot-grid" style="position:absolute;top:0;left:0;width:4000px;height:3000px;pointer-events:none;">
    <defs>
      <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.1)"/>
      </pattern>
    </defs>
    <rect width="8000" height="4000" fill="url(#dots)"/>
  </svg>
</div>

<div id="input-wrap">
  <div id="no-results">nothing found</div>
  <div id="query-field">
    <div id="query-suggestion" aria-hidden="true"></div>
    <input id="query-input" type="text" placeholder="" autocomplete="off" disabled>
  </div>
  <button id="send-btn" disabled>&#x2192;</button>
  <svg id="loading-dot" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;">
    <g><path d="M164.26,23.392c21.179,-27.227 60.479,-32.138 87.706,-10.958c27.227,21.179 32.138,60.479 10.958,87.706c-21.179,27.227 -60.479,32.138 -87.706,10.958c-27.227,-21.179 -32.138,-60.479 -10.958,-87.706Z"/><path d="M315.148,226.786c31.955,-12.99 68.445,2.408 81.435,34.363c12.99,31.955 -2.408,68.445 -34.363,81.435c-31.955,12.99 -68.445,-2.408 -81.435,-34.363c-12.99,-31.955 2.408,-68.445 34.363,-81.435Z"/><path d="M21.168,272.999c4.728,-34.169 36.308,-58.072 70.477,-53.343c34.169,4.728 58.072,36.308 53.343,70.477c-4.728,34.169 -36.308,58.072 -70.477,53.343c-34.169,-4.728 -58.072,-36.308 -53.343,-70.477Z"/></g>
    <path d="M149.877,200.788c4.728,-34.169 36.308,-58.072 70.477,-53.343c34.169,4.728 58.072,36.308 53.343,70.477c-4.728,34.169 -36.308,58.072 -70.477,53.343c-34.169,-4.728 -58.072,-36.308 -53.343,-70.477Z"/>
  </svg>
</div>

<svg id="line-overlay"></svg>

<div id="lightbox">
  <button id="lb-close">&#x2715;</button>
  <button id="lb-prev">&#x2039;</button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next">&#x203a;</button>
  <div id="lb-counter"></div>
</div>


<div id="model-lightbox">
  <button id="mlb-close">&#x2715;</button>
  <div id="mlb-canvas-wrap"></div>
</div>

<div id="project-lightbox">
  <div id="plb-inner">
    <button id="plb-close">&#x2715;</button>
    <div id="plb-title"></div>
    <div id="plb-tabs"></div>
    <div id="plb-body"></div>
  </div>
</div>

<button id="view-toggle" type="button" aria-pressed="false">list view</button>
<div id="desktop-list-view"></div>

<div id="mobile-view"></div>

<script type="module" src="main.js"></script>
</body>
</html>
