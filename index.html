<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joel Tenenberg</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="canvas-root">
  <svg id="dot-grid" style="position:absolute;top:0;left:0;width:4000px;height:3000px;pointer-events:none;">
    <defs>
      <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.1)"/>
      </pattern>
    </defs>
    <rect width="8000" height="4000" fill="url(#dots)"/>
  </svg>
  <svg id="cluster-svg"></svg>
  <div id="input-wrap">
    <input id="query-input" type="text" placeholder="" autocomplete="off" disabled>
    <button id="send-btn" disabled>&#x2192;</button>
    <div id="loading-dot"></div>
  </div>
</div>

<svg id="line-overlay"></svg>

<div id="lightbox">
  <button id="lb-close">&#x2715;</button>
  <button id="lb-prev">&#x2039;</button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next">&#x203a;</button>
  <div id="lb-counter"></div>
</div>

<div id="text-lightbox">
  <button id="tlb-close">&#x2715;</button>
  <div id="tlb-inner">
    <div id="tlb-title"></div>
    <div id="tlb-body"></div>
  </div>
</div>

<div id="model-lightbox">
  <button id="mlb-close">&#x2715;</button>
  <div id="mlb-canvas-wrap"></div>
</div>

<div id="mobile-view"></div>

<script type="module" src="main.js"></script>
</body>
</html>
