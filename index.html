<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joel Tenenberg</title>
<link rel="icon" type="image/svg+xml" href="media/icons/LOGO.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="intro-overlay">
  <canvas id="intro-canvas" width="420" height="420"></canvas>
</div>

<div id="top-left-stack">
  <header id="site-header" aria-label="Site introduction">
    <img id="site-header-logo" src="media/icons/Name_bold.svg" alt="Joel Tenenberg">
    <p id="site-header-intro">between creative technology and spatial design</p>
  </header>
</div>

<div id="top-bar">
  <div id="view-toggle" role="group" aria-label="View mode">
    <span id="view-toggle-pill" aria-hidden="true"></span>
    <button type="button" data-view="nodes">nodes</button>
    <button type="button" data-view="list">list</button>
  </div>
  <button type="button" id="about-link">about</button>
</div>

<div id="desktop-list-view"></div>

<!-- Holds the throwaway "flyer" elements during a node ⇄ list transition. -->
<div id="view-flight-layer" aria-hidden="true"></div>

<div id="canvas-root">
  <svg id="dot-grid" style="position:absolute;top:0;left:0;width:4000px;height:3000px;pointer-events:none;">
    <defs>
      <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.1)"/>
      </pattern>
    </defs>
    <rect width="8000" height="4000" fill="url(#dots)"/>
  </svg>
  <svg id="theme-line-overlay" style="position:absolute;top:0;left:0;width:8000px;height:4000px;overflow:visible;pointer-events:none;"></svg>
</div>

<div id="lightbox">
  <button id="lb-close">&#x2715;</button>
  <button id="lb-prev">&#x2039;</button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next">&#x203a;</button>
  <div id="lb-counter"></div>
</div>


<div id="model-lightbox">
  <button id="mlb-close">&#x2715;</button>
  <div id="mlb-canvas-wrap"></div>
</div>

<div id="project-lightbox">
  <div id="plb-inner">
    <button id="plb-close">&#x2715;</button>
    <div id="plb-title"></div>
    <div id="plb-tabs"></div>
    <div id="plb-body"></div>
  </div>
</div>

<div id="mobile-view"></div>

<script type="module" src="main.js"></script>
</body>
</html>
